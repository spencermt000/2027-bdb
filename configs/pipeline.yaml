seed: 2027

# Stage A: forty
forty:
  start_speed_thresh: 0.3     # yd/s
  start_min_frames: 3
  dash_length: 40.0           # yd
  max_fit_rmse: 0.5           # yd/s, QC
  max_time_resid: 0.25        # s, |model - official|, QC

# Stage B: shuttle
shuttle:
  brake_decel_thresh: 2.0     # yd/s^2, braking onset: a_long < -thresh
  dwell_speed: 1.0            # yd/s
  reaccel_window: 0.5         # s
  leg_dist: [5.0, 10.0, 5.0]  # yd, nominal; used by cod_cost
  smoother_sigma: 0.05        # yd, position measurement SD
  smoother_q: 100.0           # yd^2/s^5, white-jerk spectral density
  min_turn_prominence: 2.0    # yd, a turning point must stick out this far in p
  min_frames: 20
  start_speed_thresh: 0.5     # yd/s, smoothed speed; sustained rise marks movement onset
  start_min_frames: 3
  start_fit_frames: 5         # frames used to back-extrapolate the true start
  max_start_backoff: 0.5      # s, cap on back-extrapolation
  entry_ratio_dist: observed  # observed | nominal leg distance for the forty-profile speed
  min_finish_speed: 3.0       # yd/s, |v| at the finish crossing; slower = jog-through, QC
  min_t_total: 3.0            # s, QC
  max_t_total: 7.0            # s, QC
  max_time_resid: 0.5         # s, |t_total - official - cohort median offset|, QC
  forty_reference: mean       # mean | best

# Eval
eval:
  n_folds: 5
  quantiles: [0.1, 0.5, 0.9]
  rare_category_min: 5        # position levels with fewer shuttle players are pooled into OTHER
  validity_outcomes: [three_cone]   # external outcomes for incremental validity (never model inputs)
  n_boot: 1000                # player-level bootstrap resamples for harness CIs
  lgbm:                       # baseline; small data, so shallow and heavily regularized
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 4
    min_child_samples: 8
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 5.0

# 02_compute_metrics.py (movement features for game and combine tracking)
metrics:
  gap_tol: 0.005               # s, |dt - 0.1| above this flags a dropped/irregular frame
  min_step: 0.05               # yd, curvature / turn radius undefined below this step
  max_turn_radius: 200.0       # yd, cap
  roll_frames: 10              # rolling window (frames)
  ewma_span: 5
  forecast_horizons: [1, 3, 5] # frames ahead for constant-velocity / constant-acceleration forecast error
  band_forward_deg: 45         # |o - dir| below this = running forward; above 135 = backpedal; between = side
  band_back_deg: 135
  stationary_speed: 0.3        # yd/s, frames below this count as stationary (position jitter)
  cut_omega_thresh: 100.0      # deg/s, smoothed |dir rate| peak that counts as a cut
  cut_min_speed: 1.0           # yd/s, entry AND exit speed must exceed this (rejects jitter at the start/end of a run)
  reversal_deg: 135            # |exit - entry heading| above this = reversal (no meaningful L/R side)
  cut_min_separation: 3        # frames between cut peaks
  cut_window_frac: 0.5         # cut window = frames where smoothed |omega| > frac * peak
  cut_context_frames: 5        # frames before/after the cut used for entry / exit speed
  min_frames_entropy: 20
